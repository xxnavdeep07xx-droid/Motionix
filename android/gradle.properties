# Gradle settings for CI (GitHub Actions runners: 4 vCPU / 16 GB).
# If you ever build on a small local machine, cut these numbers by half.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true

# Required by AGP 9.x together with the Flutter plugin loader.
android.newDsl=false
android.builtInKotlin=false
