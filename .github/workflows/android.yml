name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test, build, verify, release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Pub get
        run: flutter pub get

      - name: Build host core for FFI tests
        run: >-
          g++ -std=c++17 -O2 -shared -fPIC
          -Icore/src -Icore/thirdparty
          core/src/*.cpp -o libmotionix_core.so

      - name: Analyze
        run: flutter analyze

      - name: Test (Dart UI + C++ core through FFI)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
        run: flutter test

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: ndk-28.2.13676358

      - name: Decode CI signing key
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CI_KEYSTORE_BASE64" ]; then
            mkdir -p android/app/keys
            printf '%s' "$CI_KEYSTORE_BASE64" | base64 -d > android/app/keys/ci-test-signing.jks
          else
            echo "No signing secret available - release will use debug signing."
          fi

      - name: Build release APK (arm64)
        env:
          MOTIONIX_STORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          MOTIONIX_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          MOTIONIX_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: flutter build apk --release

      # AGP suppresses v1 (JAR) signing when minSdk >= 24 even with
      # enableV1Signing = true (verified in run #4), leaving a v2-only APK
      # that Vivo's Funtouch OS installer rejects as "package appears to be
      # invalid". Signing is therefore done explicitly here, after the
      # build, with the full scheme set: zipalign -> v1+v2+v3.
      - name: Sign APK with full v1+v2+v3 scheme set
        env:
          MOTIONIX_STORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
          MOTIONIX_KEY_ALIAS: ${{ secrets.CI_KEY_ALIAS }}
          MOTIONIX_KEY_PASSWORD: ${{ secrets.CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f android/app/keys/ci-test-signing.jks ]; then
            echo "No CI key decoded - keeping AGP-signed APK (fork build)."
            exit 0
          fi
          BT="$(dirname "$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)")"
          echo "Using build-tools at $BT"
          "$BT/zipalign" -f -p 4 "$APK" app-release-aligned.apk
          "$BT/apksigner" sign \
            --ks android/app/keys/ci-test-signing.jks \
            --ks-key-alias "${MOTIONIX_KEY_ALIAS:-motionix}" \
            --ks-pass "pass:${MOTIONIX_STORE_PASSWORD:-motionix-ci-test}" \
            --key-pass "pass:${MOTIONIX_KEY_PASSWORD:-motionix-ci-test}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK" app-release-aligned.apk
          echo "Re-signed with v1+v2+v3."

      # A cryptographically verified signature is a release gate: if the
      # APK cannot be verified, the run fails and nothing is published.
      # NOTE: plain `apksigner verify` evaluates the APK only against the
      # platform range from its own manifest (minSdk 24+) where v1 is not
      # required, so it reports v1: false even when valid v1 signatures are
      # present. --min-sdk-version 23 forces the legacy-platform check,
      # proving the v1 (JAR) signature that OEM installers (Vivo etc.)
      # expect is really there.
      - name: Verify APK signature (release gate)
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 "$APK" | tee apksigner.log
          if [ -f android/app/keys/ci-test-signing.jks ]; then
            grep -Eq "Verified using v1 scheme \(JAR signing\): true" apksigner.log \
              || { echo "::error::v1 (JAR) signature missing - OEM installers need it"; exit 1; }
            grep -Eq "Verified using v2 scheme \(APK Signature Scheme v2\): true" apksigner.log \
              || { echo "::error::v2 signature missing"; exit 1; }
            grep -Eq "Verified using v3 scheme \(APK Signature Scheme v3\): true" apksigner.log \
              || { echo "::error::v3 signature missing"; exit 1; }
          fi

      - name: Stage release APK and notes
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d'+' -f1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "Motionix-v${VERSION}.apk"
          SHA="$(sha256sum "Motionix-v${VERSION}.apk" | awk '{print $1}')"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          {
            echo "## Motionix v${VERSION} — Phase 1 engine proof"
            echo
            echo "arm64-v8a release APK (Android 7.0+, ~51 MB)."
            echo
            echo "Install: open this page on your phone, download the APK below, then"
            echo "tap it in your notifications/Downloads and allow"
            echo "'Install unknown apps' for your browser when asked."
            echo
            echo '```'
            echo "sha256: $SHA"
            echo '```'
          } > release_notes.md

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: motionix-apk-${{ github.run_number }}
          path: Motionix-v*.apk
          if-no-files-found: error

      # Release assets are direct-download raw files (no zip wrapping),
      # publicly reachable for a public repo - phones fetch the exact bytes
      # CI produced, straight from GitHub's CDN.
      - name: Publish GitHub Release (direct-download APK)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Motionix v${{ env.VERSION }}
          body_path: release_notes.md
          files: Motionix-v${{ env.VERSION }}.apk
          fail_on_unmatched_files: true
          make_latest: true
